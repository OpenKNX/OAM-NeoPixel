[env:release_OKNXHW_OPENKNXIAO_RP2350_MINI_V1]
extends = RP2350_TP_2MB_releases, RP2040_custom, RP2040_2MB, RP2040_UPLOAD_USB, neopixel_oknxhw_OPENKNXIAO_RP2350_MINI_V1
; NOTE: re-assert the RP2350 1032 KB FS. The extends list also pulls in RP2040_2MB
; (512 KB), which — being listed AFTER RP2350_TP_2MB_releases — would otherwise win
; ("last extends wins") and silently shrink the filesystem to 512 KB. That breaks
; FW-update-over-KNX: the ~630 KB gzip OTA image no longer fits. Keep this explicit.
board_build.filesystem_size = 1056768 ; 0x102000: FS 0x0FD000..0x1FF000 (see platformio.hardware.ini)
build_flags =
  ${KNX_TP.build_flags}
  ${neopixel_oknxhw_OPENKNXIAO_RP2350_MINI_V1.build_flags}
  ${RP2350_TP_2MB_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  -D NEOPIXEL_MODULE
  -D OPENKNX_OTA_FS_ASSERT ; fail build if compressed FW no longer fits FS (FW-update-over-KNX)
  ;-D NEOPIXEL_MODULE_TEST_ENV
  ;-D NEOPIXEL_BLINK_CODE_TEST
  ;-D TWO_SEGMENTS_TEST
  ${ftc_device.build_flags}
  ${ftc_delta.build_flags}

