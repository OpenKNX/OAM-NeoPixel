  ;-D NEOPIXEL_MODULE_TEST_ENV    ; Enable the NeoPixel module test environment, for testing without KNX bus
  ;-D NEOPIXEL_BLINK_CODE_TEST    ; Enable blink code tests (requires NEOPIXEL_MODULE_TEST_ENV)
  ;-D OPENKNX_TRACE1
  -D OPENKNX_WEBCONSOLE
  ${ftc_device.build_flags}
  ${ftc_delta.build_flags}

