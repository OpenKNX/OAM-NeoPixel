;
; global custom
;
[custom]
build_flags =
  ; add OPENKNX_WATCHDOG normal only in releases and not here
  -D OPENKNX_WATCHDOG
  ;-D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  -D DEBUG_TP_FRAMES
  ;-D USE_KNX_DMA_UART=0
  ;-D USE_KNX_DMA_IRQ=0
  ;-D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

; ============================================================================
; NeoPixel Effect Configuration
; ============================================================================
; Effects can be left out of the build to save flash, either one at a time or in
; groups. The complete list of flags is generated from the effect headers into
;   doc/Effect-Flags.md
; and is not repeated here: this file is edited by hand, and a generated block in
; it turns every effect change into a diff on the build configuration.
;
; Two collective switches cover the common cases:
;   -D NEOPIXEL_DISABLE_2D        leave out every 2D effect
;   -D NEOPIXEL_MINIMAL_EFFECTS   leave out the extended effects
;
; --- Effect parameter description texts (default: OFF, ~20 KB flash) ---
; The PARAM_DESC_DE_EN() texts in the effect headers are build-time documentation:
; Build-EffectParameters.ps1 parses them out of the headers to generate the ETS
; help files. Nothing calls getParameterDescription() at runtime, but the method is
; virtual, so the linker cannot drop the texts - they are compiled out instead.
; Set this only if you add a runtime consumer (e.g. a console command for them):
;  -D NEOPIXEL_EFFECT_PARAM_DESCRIPTIONS=1
; ============================================================================

; [custom_develop] moved to platformio.custom.dev.ini


; ============================================================================
; FTC -- file transfer over KNX (lib/OFM-FileTransferModule).
; Pull ${ftc_device.build_flags} into an env, and ${ftc_delta.build_flags} next to it where the
; filesystem can hold the rebuilt image AND the patch at the same time.
; Sizes and the full switch list: lib/OFM-FileTransferModule/doc/FLAGS.md
; ============================================================================

[ftc_device]                            ; a managed end device: access protection, download, dirs, fast upload, console
build_flags =
  -D OPENKNX_FTC_PROFILE_DEVICE         ; the profile: security + download + dirops + fastupload (+ gzip on ESP32)
  -D OPENKNX_FTC_CONSOLE                ; must stay an explicit -D: OGM-Common (Console.h) reads it and cannot see the module header

[ftc_delta]                             ; firmware as a difference to the running image -- add ONLY where there is room
build_flags =
  -D OPENKNX_FTC_DELTA_UPDATE           ; peak filesystem use = patch + unpacked patch + rebuilt image

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; [custom_develop_ESP32] moved to platformio.custom.dev.ini

; ----------------------------------------------------------------------------
; NeoPixel-specific ESP32 4MB layout - replaces OGM-Common's [ESP32_4MB].
; Reason: knx needs 100 KB (knx_used 69,692 B), the shared table gives 64 KB.
; app0 keeps its full 2.50 MB; the extra space comes from the two unpartitioned
; gaps the shared table left. Deliberately a product-local table - OGM-Common's
; is shared by every OpenKNX ESP32 product and must not be resized for one
; application's footprint.
; NOTE the file lives in partitions/, NOT in data/: data/ is PlatformIO's
; default data_dir and would bake the CSV into the device filesystem image.
; See partitions/neopixel_esp32_4mb.csv for the sizing and its caveats.
; ----------------------------------------------------------------------------
[ESP32_4MB_NEOPIXEL]
board_build.partitions = partitions/neopixel_esp32_4mb.csv

; ----------------------------------------------------------------------------
; newlib-nano printf from ROM. The chip carries printf, _vfprintf_r,
; _vfiprintf_r, _printf_i and _printf_common in mask ROM; without this script
; they are linked into flash a second time. Measured on ESP32-C3: 18,572 bytes.
; Only the FILE/stream printf family moves - our logger goes through vsnprintf
; (_svfprintf_r), which stays in flash, so "%f" output is unaffected.
; ESP32-C6 has no such ROM script and is deliberately absent here.
; ----------------------------------------------------------------------------
[esp32_rom_nano_printf]
build_flags = -Wl,-T,esp32.rom.newlib-nano.ld

[esp32c3_rom_nano_printf]
build_flags = -Wl,-T,esp32c3.rom.newlib-nano.ld

[esp32s3_rom_nano_printf]
build_flags = -Wl,-T,esp32s3.rom.newlib-nano.ld

[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -I lib/OGM-HardwareConfig/include/
  ;${custom_develop_ESP32.build_flags}
  ;${custom.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ;-D OPENKNX_LOOPTIME_WARNING=10
  

; RP2040
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  ; -D USE_KNX_DMA_UART=0
  ; -D USE_KNX_DMA_IRQ=0
  ; -D DEBUG_TP_FRAMES

; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ; -D OPENKNX_FILE_TRANSFER_IGNORE

