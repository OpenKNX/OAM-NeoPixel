; ============================================================================
; REG2 Variants
; ============================================================================
[env:release_OKNXHW_REG2_PIPICO_V1]
; NOTE: RP2040 2MB is too tight for EXCHANGE + full firmware (firmware >974KB).
; Solution: disable EXCHANGE feature (OPENKNX_USB_EXCHANGE_IGNORE) and use TP-flash layout.
; This keeps ALL NeoPixel features. USB-stick mode is unavailable on this board.
extends = RP2040_TP_2MB_releases, RP2040_custom, RP2040_2MB, RP2040_UPLOAD_USB, neopixel_oknxhw_REG2_PIPICO_V1
build_flags =
  ${KNX_TP.build_flags}
  ${neopixel_oknxhw_REG2_PIPICO_V1.build_flags}
  ${RP2040_TP_2MB_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  -D NEOPIXEL_MODULE
  -D OPENKNX_USB_EXCHANGE_IGNORE  ; 2MB too small for EXCHANGE + full firmware
  ;-D DEVICE_DISPLAY_MODULE
  ;-D USE_GPIO_MODULE
  ;-D DEVICE_DISPLAY_MODULE_SSD1315
  ;-D DEVICE_RTC_MODULE
  ;-D EXTERNAL_FLASH_MODULE
  ;-D NO_GLOBAL_EXT_LITTLEFS

; [env:debug_OKNXHW_REG2_PIPICO_V1] moved to platformio.custom.dev.ini

[env:release_OKNXHW_REG2_PIPICO_W_V1]
; NOTE: same as PIPICO_V1 — RP2040 2MB too small for EXCHANGE + full firmware.
; EXCHANGE disabled, TP-flash layout used instead.
extends = RP2040_TP_2MB_releases, RP2040_custom, RP2040_2MB, RP2040_UPLOAD_USB, neopixel_oknxhw_REG2_PIPICO_V1
build_flags =
  ${neopixel_oknxhw_REG2_PIPICO_V1.build_flags}
  ${KNX_TP.build_flags}
  ${RP2040_TP_2MB_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  -D OPENKNX_MAX_MODULES=15
  -D NEOPIXEL_MODULE
  -D OPENKNX_USB_EXCHANGE_IGNORE  ; 2MB too small for EXCHANGE + full firmware
  -D OPENKNX_I2C_BENCHMARK
  ;-D DEVICE_DISPLAY_MODULE
  ;-D USE_GPIO_MODULE
  ;-D DEVICE_RTC_MODULE
  ;-D EXTERNAL_FLASH_MODULE
  ;-D NO_GLOBAL_EXT_LITTLEFS
  -D OPENKNX_RUNTIME_STAT
  -D OPENKNX_RUNTIME_STAT_BUCKETN=16
  "-D OPENKNX_RUNTIME_STAT_BUCKETS=10, 20, 30, 40, 50, 100, 200, 400, 800, 3200, 8000, 16000, 24000, 28000, 32000"

; [env:debug_OKNXHW_REG2_PIPICO_W_V1] moved to platformio.custom.dev.ini

[env:release_OKNXHW_REG2_PIPICO2_V1]
; NOTE: RP2350 4MB (rpipico2). EXCHANGE disabled — firmware ~994KB leaves only ~6KB gap to
;       1MB EXCHANGE boundary. Use TP layout with KNX at 0x100000 instead.
extends = RP2350_TP_4MB_releases, RP2040_UPLOAD_USB, neopixel_oknxhw_REG2_PIPICO2_V1
build_flags =
  ${KNX_TP.build_flags}
  ${neopixel_oknxhw_REG2_PIPICO2_V1.build_flags}
  ${RP2350_TP_4MB_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  -D NEOPIXEL_MODULE
  -D OPENKNX_USB_EXCHANGE_IGNORE  ; firmware ~994KB too large for EXCHANGE layout
  ;-D DEVICE_DISPLAY_MODULE
  ;-D DEVICE_RTC_MODULE
  ;-D EXTERNAL_FLASH_MODULE
  ;-D NO_GLOBAL_EXT_LITTLEFS

; [env:debug_OKNXHW_REG2_PIPICO2_V1] moved to platformio.custom.dev.ini

[env:release_OKNXHW_REG2_PIPICO2_W_V1]
extends = RP2350_WIFI_TP_releases, neopixel_oknxhw_REG2_PIPICO2_W_V1
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_custom.build_flags}
  ${RP2350_WIFI_TP_releases.build_flags}
  ${custom_releases.build_flags}
  ${neopixel_oknxhw_REG2_PIPICO2_W_V1.build_flags}
  -D NEOPIXEL_MODULE
  ;-D DEVICE_DISPLAY_MODULE
  ;-D USE_GPIO_MODULE
  ;-D DEVICE_DISPLAY_MODULE_SSD1315
  ;-D EXTERNAL_FLASH_MODULE
  ;-D NO_GLOBAL_EXT_LITTLEFS

