;
; global custom
;
[custom]
build_flags =
  ; add OPENKNX_WATCHDOG normal only in releases and not here
  -D OPENKNX_WATCHDOG
  ;-D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  -D DEBUG_TP_FRAMES
  ;-D USE_KNX_DMA_UART=0
  ;-D USE_KNX_DMA_IRQ=0
  ;-D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

; ============================================================================
; NeoPixel Effect Configuration Examples
; ============================================================================
; You can control which effects are compiled into your firmware to save flash space.
; Choose ONE of the following configurations:

; --- Option 1: ALL EFFECTS (Default - 21 effects) ---
; All effects are enabled by default. No flags needed.
; Effects: Solid, Wipe, Rainbow, Pride, Confetti, Juggle, BPM, Cylon, RGBWTest, 
;          GarageDoor, Fire, TheaterChase, TheaterChaseRainbow, Sinelon, Twinkle, 
;          Sparkle, Breathing, Strobe, Pulse, Comet, Meteor

; --- Option 2: MINIMAL EFFECTS (10 essential effects) ---
; Reduces flash usage by ~30%. Includes most popular effects.
; Effects: Solid, Wipe, Rainbow, Pride, Confetti, Juggle, BPM, Cylon, RGBWTest, GarageDoor
;[custom_effects_minimal]
;build_flags =
;  -D NEOPIXEL_MINIMAL_EFFECTS

; --- Option 3: CUSTOM SELECTION (Disable specific effects) ---
; Fine-tune which effects to exclude. Combine with MINIMAL or use standalone.
; Example: Disable fire-related and party effects to save space
;[custom_effects_custom]
;build_flags =
;  -D NEOPIXEL_DISABLE_FIRE          ; No fire simulation
;  -D NEOPIXEL_DISABLE_COMET         ; No comet effect
;  -D NEOPIXEL_DISABLE_METEOR        ; No meteor shower
;  -D NEOPIXEL_DISABLE_SPARKLE       ; No sparkle effect
;  -D NEOPIXEL_DISABLE_TWINKLE       ; No twinkle effect
;  -D NEOPIXEL_DISABLE_STROBE        ; No strobe light
;  -D NEOPIXEL_DISABLE_THEATERCHASE  ; No theater chase (disables both variants)

; --- Option 4: ULTRA-MINIMAL (Only Solid + Wipe) ---
; Maximum flash savings. Good for simple status indicators.
;[custom_effects_ultra_minimal]
;build_flags =
;  -D NEOPIXEL_MINIMAL_EFFECTS
;  -D NEOPIXEL_DISABLE_RAINBOW
;  -D NEOPIXEL_DISABLE_PRIDE
;  -D NEOPIXEL_DISABLE_CONFETTI
;  -D NEOPIXEL_DISABLE_JUGGLE
;  -D NEOPIXEL_DISABLE_BPM
;  -D NEOPIXEL_DISABLE_CYLON
;  -D NEOPIXEL_DISABLE_RGBWTEST
;  -D NEOPIXEL_DISABLE_GARAGEDOOR

; Available disable flags:
; -D NEOPIXEL_DISABLE_WIPE, RAINBOW, PRIDE, CONFETTI, JUGGLE, BPM, CYLON
; -D NEOPIXEL_DISABLE_RGBWTEST, GARAGEDOOR
; -D NEOPIXEL_DISABLE_FIRE, THEATERCHASE, SINELON, TWINKLE, SPARKLE
; -D NEOPIXEL_DISABLE_BREATHING, STROBE, PULSE, COMET, METEOR
; Note: Solid effect cannot be disabled (always included)
; ============================================================================

; [custom_develop] moved to platformio.custom.dev.ini

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; [custom_develop_ESP32] moved to platformio.custom.dev.ini

[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -I lib/OGM-HardwareConfig/include/
  ;${custom_develop_ESP32.build_flags}
  ;${custom.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ;-D OPENKNX_LOOPTIME_WARNING=10
  

; RP2040
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  ; -D USE_KNX_DMA_UART=0
  ; -D USE_KNX_DMA_IRQ=0
  ; -D DEBUG_TP_FRAMES

; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ; -D OPENKNX_FILE_TRANSFER_IGNORE

