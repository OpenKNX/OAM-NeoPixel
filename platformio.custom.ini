;
; global custom
;
[custom]
; Flash size from DEVICE_FLASH_SIZE_MB of the board in OGM-HardwareConfig (OGM-Common prepare_flash_size.py).
; RP: filesystem = flash - 4 KB EEPROM - end of the KNX/OPENKNX region. A board without the define keeps the ini values.
custom_flash_size = hwcfg
build_flags =
  ; add OPENKNX_WATCHDOG normal only in releases and not here
  -D OPENKNX_WATCHDOG
  ;-D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  -D DEBUG_TP_FRAMES
  ;-D USE_KNX_DMA_UART=0
  ;-D USE_KNX_DMA_IRQ=0
  ;-D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0
  ; effect groups and NEO_FXOFF_<n> (generated by scripts/Build-EffectParameters.ps1): before EffectPool.h in every unit
  -include $PROJECT_DIR/src/NeoPixelEffectGroups.h

; ============================================================================
; NeoPixel Effect Configuration
; ============================================================================
; Effects can be left out of the build to save flash, either one at a time or in
; groups. The complete list of flags is generated from the effect headers into
;   doc/Effect-Flags.md
; and is not repeated here: this file is edited by hand, and a generated block in
; it turns every effect change into a diff on the build configuration.
;
; Two collective switches cover the common cases:
;   -D NEOPIXEL_DISABLE_2D        leave out every 2D effect
;   -D NEOPIXEL_MINIMAL_EFFECTS   leave out the extended effects
;
; --- Effect parameter description texts (default: OFF, ~20 KB flash) ---
; The PARAM_DESC_DE_EN() texts in the effect headers are build-time documentation:
; Build-EffectParameters.ps1 parses them out of the headers to generate the ETS
; help files. Nothing calls getParameterDescription() at runtime, but the method is
; virtual, so the linker cannot drop the texts - they are compiled out instead.
; Set this only if you add a runtime consumer (e.g. a console command for them):
;  -D NEOPIXEL_EFFECT_PARAM_DESCRIPTIONS=1
; ============================================================================

; [custom_develop] moved to platformio.custom.dev.ini


; ============================================================================
; FTC -- file transfer over KNX (lib/OFM-FileTransferModule).
; Pull ${ftc_device.build_flags} into an env, and ${ftc_delta.build_flags} next to it where the
; filesystem can hold the rebuilt image AND the patch at the same time.
; Sizes and the full switch list: lib/OFM-FileTransferModule/doc/FLAGS.md
; ============================================================================

[ftc_device]                            ; a managed end device: access protection, download, dirs, fast upload, console
build_flags =
  -D OPENKNX_FTC_PROFILE_DEVICE         ; the profile: security + download + dirops + fastupload (+ gzip on ESP32)
  -D OPENKNX_FTC_CONSOLE                ; must stay an explicit -D: OGM-Common (Console.h) reads it and cannot see the module header

[ftc_delta]                             ; firmware as a difference to the running image -- add ONLY where there is room
build_flags =
  -D OPENKNX_FTC_DELTA_UPDATE           ; peak filesystem use = patch + unpacked patch + rebuilt image

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; [custom_develop_ESP32] moved to platformio.custom.dev.ini

; ----------------------------------------------------------------------------
; newlib-nano stream printf functions from ROM. Without these scripts they are
; linked into flash a second time. Measured on ESP32-C3: 18,572 bytes.
; The original ESP32 is deliberately absent: its ROM script also overrides
; vsnprintf/_svfprintf_r, and floating-point formatting can call a null ROM
; callback. ESP32-C6 has no such ROM script and is deliberately absent too.
; ----------------------------------------------------------------------------
[esp32c3_rom_nano_printf]
build_flags = -Wl,-T,esp32c3.rom.newlib-nano.ld

[esp32s3_rom_nano_printf]
build_flags = -Wl,-T,esp32s3.rom.newlib-nano.ld

[esp32c5_rom_nano_printf]
build_flags = -Wl,-T,esp32c5.rom.newlib-nano.ld

[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -I lib/OGM-HardwareConfig/include/
  ;${custom_develop_ESP32.build_flags}
  ;${custom.build_flags}
  ;-D OPENKNX_LOOPTIME_WARNING=10
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  -D OPENKNX_WEBMONITOR
  ; knx needs ~68 KiB, the OGM-Common table has 64 KiB: prepare_esp32_partitions.py moves it to 0x290000/100 KiB (layout of the former NeoPixel tables)
  -D KNX_FLASH_OFFSET=0x290000
  -D KNX_FLASH_SIZE=0x19000
  

; WiFi features of OFM-Network for the envs with KNX_IP_WIFI only (setup AP, own AP, scan, /wifi page, gateway ping)
[neopixel_wifi_features]
build_flags =
  -D OPENKNX_WIFI_AP
  -D OPENKNX_PING
lib_deps =                              ; QR code on the /wifi page without OFM-DeviceDisplay
  ${env.lib_deps}
  liux-pro/qrcode generator@^1.7.0

; RP2040
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  ; -D USE_KNX_DMA_UART=0
  ; -D USE_KNX_DMA_IRQ=0
  ; -D DEBUG_TP_FRAMES

; ESP32
[classic_esp32_optimized]
extends = custom_release_ESP32
build_unflags =
  -O0
  -O1
  -O2
  -O3
  -Og
build_flags =
  ${custom_release_ESP32.build_flags}
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
debug_build_flags = -Os -ggdb3 -g3

[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include
  ; -D OPENKNX_FILE_TRANSFER_IGNORE

; ============================================================================
; Releases
; ============================================================================

; ============================================================================
; FLASH LAYOUT DOCUMENTATION
; ============================================================================
; The script lib/OGM-Common/scripts/pio/show_flash_partitioning.py verifies
; that the KNX flash region is large enough for the KNX data (DATA*).
;
; DATA* size is estimated at build time from include/knxprod.h:
;
;   knx_used = 100                          (meta/overhead)
;            + MAIN_ParameterSize           (ETS parameter table)
;            + MAIN_MaxKoNumber * 2         (KO table)
;            + MAIN_MaxKoNumber * 4         (GA table, 2x KOs)
;            + MAIN_MaxKoNumber * 8         (association table, 4x KOs)
;            = 100 + ParamSize + KoNum * 14
;
; Current values in include/knxprod.h (updated by OpenKNXproducer):
;   MAIN_ParameterSize = 43809
;   MAIN_MaxKoNumber   = 1851
;   => knx_used = 100 + 43809 + (1851 * 14) = 69823 bytes  (~68 KB)
;
; RULE: KNX_FLASH_SIZE must be >= knx_used, with some headroom.
;       After each OpenKNXproducer run, check if knxprod.h values changed
;       and update KNX_FLASH_SIZE if needed!
;
; Current required minimum: 69823 bytes = 0x110BF (DATA*)
; KNX_FLASH_SIZE for TP boards: 0x19000 (102400 bytes, ~32 KB headroom)
;
; FLASH LAYOUTS (2MB boards):
;
; Flash size and filesystem are not set here: custom_flash_size = hwcfg in [custom]
; takes the flash size from DEVICE_FLASH_SIZE_MB of the board header, and
; OGM-Common prepare_flash_size.py sets the filesystem to
;   flash - 4096 (EEPROM) - end of the KNX/OPENKNX region.
; A board without DEVICE_FLASH_SIZE_MB (UP1-GW-UART) keeps its env-level value.
;
;  RP2040_TP_2MB_FLASH / RP2350_TP_2MB_FLASH  (all 2 MB RP targets, RELEASE):
;   Both families share one layout since the delta-update move. Fixed cost per
;   2 MB target is KNX 100 KB + OPENKNX 16 KB + EEPROM 4 KB, so firmware region
;   and filesystem split the remaining 1928 KB - every KB one gets is a KB the
;   other loses.
;   [0x000000 - 0x0E0000] Firmware  (max 896 KB; largest release build ~803 KB)
;   [0x0E0000 - 0x0F9000] KNX       0x19000 = 102400 B
;   [0x0F9000 - 0x0FD000] OPENKNX   0x4000 = 16384 B
;   [0x0FD000 - 0x1FF000] FS        0x102000 = 1056768 B (1032 KB)
;   [0x1FF000 - 0x200000] EEPROM    4096 B
;
;   WHY the filesystem is this large: a firmware DELTA update rebuilds the new
;   image on the device and stages it UNCOMPRESSED, while the packed and the
;   unpacked patch still sit next to it:
;       FS_free >= target_image + packed_patch + unpacked_patch
;   With the previous split (FS 840/872 KB against a ~800 KB firmware) only
;   38-77 KB were left for both patch files, i.e. delta update could not work on
;   2 MB at all. Now ~229 KB remain. See deltaStagingRoom()/deltaSourceLimit()
;   in OFM-FileTransferModule. Note deltaSourceLimit() == KNX_FLASH_OFFSET: the
;   firmware region IS the delta source window.
;
;   MIGRATION COST, deliberate: moving KNX invalidates the KNX region, the
;   OPENKNX state region and the filesystem on every device already in the
;   field. After this update they need an ETS download; "Letzter Zustand" and
;   the filesystem content are gone. One-time, and unavoidable if delta updates
;   are ever to work on 2 MB.
;
;   There are no RP2040/RP2350 debug envs: a debug build does not fit 2 MB
;   (measured 2026-11-14, KNeoPix RP2350: debug ~1227 KB, release 642 KB). The
;   only debug env is debug_OKNXHW_OPENKNXIAO_KNEOPIX_ESP32S3_V1 (platformio.custom.dev.ini).
; ============================================================================

; ----------------------------------------------------------------------------
; RP2040 TP 2MB Flash Configuration
; KNX at 0x0E0000: shared with the RP2350 2 MB layout since the delta-update
; move. The firmware region gives up 192 KB so the filesystem can stage a
; rebuilt image. Max firmware 896 KB (largest release build ~803 KB).
; KNX_FLASH_SIZE 0x19000 (100 KB), DATA* currently 69823 B (2026-11-14). See doc above.
; ----------------------------------------------------------------------------
[RP2040_TP_2MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x0E0000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x0F9000

; ----------------------------------------------------------------------------
; RP2350 TP 2MB Flash Configuration
; KNX_FLASH_SIZE enlarged to 0x19000 (100 KB) for Effektmanager data:
;   - Original params: ~53 KB
;   - Effektmanager (16 EM × 99 Cues × 27 Bytes): ~43 KB
;   - Total: ~96 KB + headroom
; KNX is at 0x0E0000, shared with the RP2040 2 MB layout since the delta-update
; move.
; This keeps additional firmware headroom while preserving KNX size.
; KNX_FLASH_SIZE must be >= knx_used. See doc above.
; ----------------------------------------------------------------------------
[RP2350_TP_2MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x0E0000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x0F9000

; RP2350 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2350_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
build_flags =
    ${BASE.build_flags}
    ${RP2350_TP_2MB_FLASH.build_flags}  ; Use RP2350 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG

; RP2040 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2040_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
; FS starts right after OPENKNX (0x0FD000) and runs to EEPROM (0x1FF000) = 0x102000 = 1032 KB,
; set by prepare_flash_size.py. History: 512 KB (inherited from RP2040_2MB) was too small for the
; gzip OTA image, then 840 KB, now 1032 KB so a delta update can stage the rebuilt image.
build_flags =
    ${BASE.build_flags}
    ${RP2040_TP_2MB_FLASH.build_flags}  ; Use RP2040 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG
    -D OPENKNX_OTA_FS_ASSERT ; fail build if compressed FW no longer fits FS (FW-update-over-KNX)

