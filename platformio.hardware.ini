; ============================================================================
; Hardware GPIO Configuration for NeoPixel Module
; ============================================================================
; This file defines hardware-specific GPIO mappings for different boards.
; Each section provides NeoPixel GPIO port definitions that are included
; at compile time via -D flags.
;
; Usage: Add the appropriate section to your environment's 'extends' list
; ============================================================================

; ============================================================================
; FLASH LAYOUT DOCUMENTATION
; ============================================================================
; The script lib/OGM-Common/scripts/pio/show_flash_partitioning.py verifies
; that the KNX flash region is large enough for the KNX data (DATA*).
;
; DATA* size is estimated at build time from include/knxprod.h:
;
;   knx_used = 100                          (meta/overhead)
;            + MAIN_ParameterSize           (ETS parameter table)
;            + MAIN_MaxKoNumber * 2         (KO table)
;            + MAIN_MaxKoNumber * 4         (GA table, 2x KOs)
;            + MAIN_MaxKoNumber * 8         (association table, 4x KOs)
;            = 100 + ParamSize + KoNum * 14
;
; Current values in include/knxprod.h (updated by OpenKNXproducer):
;   MAIN_ParameterSize = 43678
;   MAIN_MaxKoNumber   = 1851
;   => knx_used = 100 + 43678 + (1851 * 14) = 69692 bytes  (~68 KB)
;
; RULE: KNX_FLASH_SIZE must be >= knx_used, with some headroom.
;       After each OpenKNXproducer run, check if knxprod.h values changed
;       and update KNX_FLASH_SIZE if needed!
;
; Current required minimum: 69692 bytes = 0x1103C (DATA*)
; KNX_FLASH_SIZE for TP boards: 0x19000 (102400 bytes, ~32 KB headroom)
;
; FLASH LAYOUTS (2MB boards):
;
;  RP2040_TP_2MB_FLASH / RP2350_TP_2MB_FLASH  (all 2 MB RP targets, RELEASE):
;   Both families share one layout since the delta-update move. Fixed cost per
;   2 MB target is KNX 100 KB + OPENKNX 16 KB + EEPROM 4 KB, so firmware region
;   and filesystem split the remaining 1928 KB - every KB one gets is a KB the
;   other loses.
;   [0x000000 - 0x0E0000] Firmware  (max 896 KB; largest release build ~803 KB)
;   [0x0E0000 - 0x0F9000] KNX       0x19000 = 102400 B
;   [0x0F9000 - 0x0FD000] OPENKNX   0x4000 = 16384 B
;   [0x0FD000 - 0x1FF000] FS        0x102000 = 1056768 B (1032 KB)
;   [0x1FF000 - 0x200000] EEPROM    4096 B
;
;   WHY the filesystem is this large: a firmware DELTA update rebuilds the new
;   image on the device and stages it UNCOMPRESSED, while the packed and the
;   unpacked patch still sit next to it:
;       FS_free >= target_image + packed_patch + unpacked_patch
;   With the previous split (FS 840/872 KB against a ~800 KB firmware) only
;   38-77 KB were left for both patch files, i.e. delta update could not work on
;   2 MB at all. Now ~229 KB remain. See deltaStagingRoom()/deltaSourceLimit()
;   in OFM-FileTransferModule. Note deltaSourceLimit() == KNX_FLASH_OFFSET: the
;   firmware region IS the delta source window.
;
;   MIGRATION COST, deliberate: moving KNX invalidates the KNX region, the
;   OPENKNX state region and the filesystem on every device already in the
;   field. After this update they need an ETS download; "Letzter Zustand" and
;   the filesystem content are gone. One-time, and unavoidable if delta updates
;   are ever to work on 2 MB.
;
;   DEBUG builds do NOT use this layout - they are ~180 KB larger than release
;   and would not fit the 864 KB firmware region, and they have no use for delta
;   updates. They keep the pre-move boundaries via RP2040_TP_2MB_FLASH_DEBUG /
;   RP2350_TP_2MB_FLASH_DEBUG:
;     RP2040 debug:  KNX @ 0x110000, OPENKNX @ 0x129000, FS 860160 (840 KB)
;     RP2350 debug:  KNX @ 0x108000, OPENKNX @ 0x121000, FS 892928 (872 KB)
; ============================================================================

; ----------------------------------------------------------------------------
; RP2040 TP 2MB Flash Configuration
; KNX at 0x0E0000: shared with the RP2350 2 MB layout since the delta-update
; move. The firmware region gives up 192 KB so the filesystem can stage a
; rebuilt image. Max firmware 896 KB (largest release build ~803 KB). Debug envs
; keep the old 0x110000 boundary - see RP2040_TP_2MB_FLASH_DEBUG.
; KNX_FLASH_SIZE 0x19000 (100 KB), DATA* currently 65776 B. See doc above.
; ----------------------------------------------------------------------------
[RP2040_TP_2MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x0E0000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x0F9000

; ----------------------------------------------------------------------------
; RP2350 TP 2MB Flash Configuration
; KNX_FLASH_SIZE enlarged to 0x19000 (100 KB) for Effektmanager data:
;   - Original params: ~53 KB
;   - Effektmanager (16 EM × 99 Cues × 27 Bytes): ~43 KB
;   - Total: ~96 KB + headroom
; KNX is at 0x0E0000, shared with the RP2040 2 MB layout since the delta-update
; move. Debug envs keep the old 0x108000 boundary - see RP2350_TP_2MB_FLASH_DEBUG.
; This keeps additional firmware headroom while preserving KNX size.
; KNX_FLASH_SIZE must be >= knx_used. See doc above.
; ----------------------------------------------------------------------------
; ----------------------------------------------------------------------------
; Legacy 2 MB boundaries - DEBUG ENVIRONMENTS ONLY
; ----------------------------------------------------------------------------
; The release layout moved KNX down to 0x0E0000 so the filesystem can hold the
; uncompressed image a firmware DELTA update rebuilds (FS must fit target image
; + packed patch + unpacked patch; see OFM-FileTransferModule deltaStagingRoom).
; A debug build is ~200 KB larger than release and does not fit the resulting
; 896 KB firmware region - and it has no use for delta updates. Debug therefore
; keeps the pre-move boundaries and the pre-move filesystem size.
;
; Consequence, deliberate: flashing a debug image over a release image (or back)
; crosses a KNX region boundary, so the KNX parameters and the filesystem
; content are lost on that switch. That is a development workflow, not a
; product one - the release layout is the one that ships.
;
; Debug envs on 2 MB pull this in as:
;   build_unflags = ${RP2350_TP_2MB_FLASH_DEBUG.build_unflags}
;   build_flags   = ${env:release_....build_flags}
;                   ${RP2350_TP_2MB_FLASH_DEBUG.build_flags}
;   board_build.filesystem_size = <legacy size>
; ----------------------------------------------------------------------------
[RP_TP_2MB_FLASH_DEBUG_UNFLAGS]
build_unflags =
    -D KNX_FLASH_OFFSET=0x0E0000
    -D OPENKNX_FLASH_OFFSET=0x0F9000

[RP2040_TP_2MB_FLASH_DEBUG]
build_unflags = ${RP_TP_2MB_FLASH_DEBUG_UNFLAGS.build_unflags}
build_flags =
    -D KNX_FLASH_OFFSET=0x110000
    -D OPENKNX_FLASH_OFFSET=0x129000
; board_build.filesystem_size = 860160   (0xD2000: FS 0x12D000..0x1FF000)

[RP2350_TP_2MB_FLASH_DEBUG]
build_unflags = ${RP_TP_2MB_FLASH_DEBUG_UNFLAGS.build_unflags}
build_flags =
    -D KNX_FLASH_OFFSET=0x108000
    -D OPENKNX_FLASH_OFFSET=0x121000
; board_build.filesystem_size = 892928   (0xDA000: FS 0x125000..0x1FF000)

[RP2350_TP_2MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x0E0000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x0F9000

; RP2350 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2350_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
board_build.filesystem_size = 1056768 ; 0x102000: FS 0x0FD000..0x1FF000, central for all RP2350-TP-2MB targets
build_flags =
    ${BASE.build_flags}
    ${RP2350_TP_2MB_FLASH.build_flags}  ; Use RP2350 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG

; RP2040 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2040_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
; FS starts right after OPENKNX (0x0FD000) and runs to EEPROM (0x1FF000) = 0x102000 = 1032 KB.
; History: 512 KB (inherited from RP2040_2MB) was too small for the gzip OTA image, then
; 840 KB, now 1032 KB so a delta update can stage the rebuilt uncompressed image.
board_build.filesystem_size = 1056768 ; 0x102000: FS 0x0FD000..0x1FF000 (central for all RP2040-TP-2MB targets)
build_flags =
    ${BASE.build_flags}
    ${RP2040_TP_2MB_FLASH.build_flags}  ; Use RP2040 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG
    -D OPENKNX_OTA_FS_ASSERT ; fail build if compressed FW no longer fits FS (FW-update-over-KNX)

