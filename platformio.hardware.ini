; ----------------------------------------------------------------------------
; REG2 ESP32S3 V1 (Terminal Board Pins)
; ----------------------------------------------------------------------------
; Uses Waveshare ESP32-S3 Pico board configuration
; Custom board parameters from platformio.boards.ini integrated here directly
; because PlatformIO doesn't support [custom_board_*] sections in extra_configs
[neopixel_oknxhw_REG2_ESP32S3_V1]
board = esp32-s3-devkitc-1
board_build.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_freq = 80m
board_build.flash_size = 16MB
board_build.mcu = esp32s3
board_build.variant = ESP32S3
board_build.extra_flags =
    -D ARDUINO_WAVESHARE_ESP32S3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D ARDUINO_USB_MODE=1
build_flags =
    -DDEVICE_REG2_ESP_S3_PICO_V1
    -DNEOPIXEL_HW_GPIO_PORTS
    -DNEOPIXEL_HW_PORT_COUNT=7
    -DNEOPIXEL_EXT_RELAIS=3
    -DNEOPIXEL_HW_HAS_NETWORK=1
    -DNEOPIXEL_HW_PORT_1_GPIO=REG2_TERM_PIN4
    "-DNEOPIXEL_HW_PORT_1_LABEL=\"TERM4 (GPIO15)\""
    -DNEOPIXEL_HW_PORT_2_GPIO=REG2_TERM_PIN5
    "-DNEOPIXEL_HW_PORT_2_LABEL=\"TERM5 (GPIO16)\""
    -DNEOPIXEL_HW_PORT_3_GPIO=REG2_TERM_PIN6
    "-DNEOPIXEL_HW_PORT_3_LABEL=\"TERM6 (GPIO17)\""
    -DNEOPIXEL_HW_PORT_4_GPIO=REG2_TERM_PIN7
    "-DNEOPIXEL_HW_PORT_4_LABEL=\"TERM7 (GPIO18)\""
    -DNEOPIXEL_HW_PORT_5_GPIO=REG2_TERM_PIN8
    "-DNEOPIXEL_HW_PORT_5_LABEL=\"TERM8 (GPIO33)\""
    -DNEOPIXEL_HW_PORT_6_GPIO=REG2_TERM_PIN9
    "-DNEOPIXEL_HW_PORT_6_LABEL=\"TERM9 (GPIO34)\""
    -DNEOPIXEL_HW_PORT_7_GPIO=REG2_TERM_PIN10
    "-DNEOPIXEL_HW_PORT_7_LABEL=\"TERM10 (GPIO6)\""

