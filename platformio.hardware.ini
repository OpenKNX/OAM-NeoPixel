; ============================================================================
; Hardware GPIO Configuration for NeoPixel Module
; ============================================================================
; This file defines hardware-specific GPIO mappings for different boards.
; Each section provides NeoPixel GPIO port definitions that are included
; at compile time via -D flags.
;
; Usage: Add the appropriate section to your environment's 'extends' list
; ============================================================================

; ============================================================================
; FLASH LAYOUT DOCUMENTATION
; ============================================================================
; The script lib/OGM-Common/scripts/pio/show_flash_partitioning.py verifies
; that the KNX flash region is large enough for the KNX data (DATA*).
;
; DATA* size is estimated at build time from include/knxprod.h:
;
;   knx_used = 100                          (meta/overhead)
;            + MAIN_ParameterSize           (ETS parameter table)
;            + MAIN_MaxKoNumber * 2         (KO table)
;            + MAIN_MaxKoNumber * 4         (GA table, 2x KOs)
;            + MAIN_MaxKoNumber * 8         (association table, 4x KOs)
;            = 100 + ParamSize + KoNum * 14
;
; Current values in include/knxprod.h (updated by OpenKNXproducer):
;   MAIN_ParameterSize = 41554
;   MAIN_MaxKoNumber   = 1723
;   => knx_used = 100 + 41554 + (1723 * 14) = 65776 bytes  (~64 KB)
;
; RULE: KNX_FLASH_SIZE must be >= knx_used, with some headroom.
;       After each OpenKNXproducer run, check if knxprod.h values changed
;       and update KNX_FLASH_SIZE if needed!
;
; Current required minimum: 65776 bytes = 0x100F0 (DATA*)
; KNX_FLASH_SIZE for TP boards: 0x19000 (102400 bytes, ~36 KB headroom)
;
; FLASH LAYOUTS (2MB boards):
;
;  RP2040_TP_2MB_FLASH  (standard RP2040, TP feature set):
;   [0x00000 - 0x110000] Firmware  (max ~1088 KB)
;   [0x110000- 0x129000] KNX       0x19000 = 102400 B
;   [0x129000- 0x12D000] OPENKNX   0x4000 = 16384 B
;   [0x12D000- 0x17F000] FREE      ~328 KB
;   [0x17F000- 0x1FF000] FS        512 KB  (from RP2040_2MB)
;   [0x1FF000- 0x200000] EEPROM    4096 B
;
;  RP2350_TP_2MB_FLASH  (RP2350 no-WiFi, full feature set):
;   [0x00000 - 0x108000] Firmware  (max ~1056 KB)
;   [0x108000- 0x121000] KNX       0x19000 = 102400 B
;   [0x121000- 0x125000] OPENKNX   0x4000 = 16384 B
;   [0x125000- 0x1FF000] FS        0xDA000 = 892928 B
;   [0x1FF000- 0x200000] EEPROM    4096 B
;
;  RP2350_WIFI_FLASH  (DEPRECATED — 0xE000 < knx_used 65776 B, unused):
;   [0x000000 - 0x120000] Firmware  (max ~1152 KB)
;   [0x120000 - 0x12E000] KNX       0xE000 = 57344 B
;   [0x12E000 - 0x132000] OPENKNX   0x4000 = 16384 B
;   [0x132000 - 0x3FF000] FS        ~3356 KB  (4MB board)
;   [0x3FF000 - 0x400000] EEPROM    4096 B
;
;  RP2040_EXCHANGE_FLASH  (DEPRECATED — 0xE000 < knx_used 65776 B, unused):
;   EXCHANGE always starts at 0x100000, so KNX+OPENKNX must end there.
;   [0x000000 - 0xEC9C0] Firmware  (REG2_PIPICO_V1 release: ~969 KB)
;   [0xEC9C0 - 0xEE000] FREE      ~5.5 KB
;   [0xEE000 - 0xFC000] KNX       0xE000 = 57344 B  (DATA* ~53136 B)
;   [0xFC000 - 0x100000] OPENKNX  0x4000 = 16384 B
;   [0x100000- 0x140000] EXCHANGE  256 KB  (2MB) or 512 KB (4MB)
;   [0x140000- 0x1FF000] FS        782 KB  (2MB) / 2.5 MB (4MB)
;   [0x1FF000- 0x200000] EEPROM    4096 B
; ============================================================================

; ----------------------------------------------------------------------------
; RP2040 TP 2MB Flash Configuration
; KNX pushed to 0x110000: firmware grew past 0xFC000 (~1018 KB with stateless
; text architecture + Effekt-Text KOs). Max firmware now ~1088 KB.
; KNX_FLASH_SIZE 0x19000 (100 KB), DATA* currently 65776 B. See doc above.
; ----------------------------------------------------------------------------
[RP2040_TP_2MB_FLASH]
build_flags =
        -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x110000
        -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x129000

; ----------------------------------------------------------------------------
; RP2350 WiFi Flash Configuration (replaces RP2040_FLASH for WiFi variants)
; KNX moved forward because WiFi firmware is larger (~1.1 MB).
; Used by: KNEOPIX_RP2350 WiFi boards (firmware < 0x120000)
; KNX_FLASH_SIZE must be >= knx_used (currently ~53136 B). See doc above.
; ----------------------------------------------------------------------------
; DEPRECATED — KNX_FLASH_SIZE 0xE000 (57344 B) < knx_used (65776 B). Unused by any env.
[RP2350_WIFI_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0xE000
    -D KNX_FLASH_OFFSET=0x120000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x12E000

; ----------------------------------------------------------------------------
; RP2350 WiFi EXCHANGE Flash Configuration (REG2_PIPICO2_W — more modules)
; DEPRECATED — firmware now ~1.225 MB, overflows 0x128000. Use RP2350_WIFI_TP_FLASH.
; ----------------------------------------------------------------------------
[RP2350_WIFI_EXCHANGE_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0xE000
    -D KNX_FLASH_OFFSET=0x128000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x136000

; RP2350 WiFi TP Flash — REG2_PIPICO2_W with full feature set (EffektManager + 2D effects)
; Firmware grew to ~1.225 MB with new features. KNX pushed to 0x140000 for headroom.
; Layout (4MB):
;   [0x000000 - 0x12C000] Firmware  (max ~1.23 MB, currently ~1.225 MB)
;   [0x12C000 - 0x140000] FREE      (~80 KB growth headroom)
;   [0x140000 - 0x159000] KNX       0x19000 = 100 KB (Effektmanager data)
;   [0x159000 - 0x15D000] OPENKNX   0x4000 = 16 KB
;   [0x15D000 - 0x3FF000] FS        2,760,704 B (~2.63 MB)
;   [0x3FF000 - 0x400000] EEPROM    4096 B
; board_build.filesystem_size = 2760704  (set in env)
; ----------------------------------------------------------------------------
[RP2350_WIFI_TP_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x140000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x159000

; ----------------------------------------------------------------------------
; RP2350 TP 2MB Flash Configuration
; KNX_FLASH_SIZE enlarged to 0x19000 (100 KB) for Effektmanager data:
;   - Original params: ~53 KB
;   - Effektmanager (16 EM × 99 Cues × 27 Bytes): ~43 KB
;   - Total: ~96 KB + headroom
; For future growth reserve, KNX is pushed to 0x108000.
; This keeps additional firmware headroom while preserving KNX size.
; KNX_FLASH_SIZE must be >= knx_used. See doc above.
; ----------------------------------------------------------------------------
[RP2350_TP_2MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000
    -D KNX_FLASH_OFFSET=0x108000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0x121000

; ----------------------------------------------------------------------------
; RP2040/RP2350 EXCHANGE Flash Configuration (REG2 boards with USB Exchange)
; The USB EXCHANGE partition starts at 0x100000 (fixed in OFM-UsbExchange).
; KNX+OPENKNX must fit within 0x000000–0x100000 (after firmware).
; Current firmware (REG2_PIPICO_V1 release): ~969 KB → KNX gap: ~5.5 KB
; DEPRECATED — KNX_FLASH_SIZE 0xE000 (57344 B) < knx_used (65776 B) and
; KNX+OPENKNX no longer fit before the 0x100000 EXCHANGE boundary. Unused by any env.
; ----------------------------------------------------------------------------
[RP2040_EXCHANGE_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0xE000
    -D KNX_FLASH_OFFSET=0xEE000
    -D OPENKNX_FLASH_SIZE=0x4000
    -D OPENKNX_FLASH_OFFSET=0xFC000

; RP2350 WiFi Releases - inherits platform settings from RP2040, but overrides flash config
[RP2350_WIFI_releases]
extends = RP2040_custom, RP2040, RP2040_4MB
board = rpipico2w
board_build.filesystem_size = 2936832 ; 4MB - EEPROM(4KB) - FS_START(0x132000)
build_flags =
  ${BASE.build_flags}
  ${RP2350_WIFI_FLASH.build_flags}  ; Use WiFi flash offsets instead of RP2040_FLASH
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
  -D OPENKNX_WATCHDOG
  -D OPENKNX_USB_EXCHANGE_IGNORE

; RP2350 WiFi TP Releases - full feature set on RP2350 WiFi with KNX at 0x140000
[RP2350_WIFI_TP_releases]
extends = RP2040_custom, RP2040, RP2040_4MB
board = rpipico2w
board_build.filesystem_size = 2760704 ; FS: 0x15D000 - 0x3FF000 (KNX at 0x140000)
build_flags =
    ${BASE.build_flags}
    ${RP2350_WIFI_TP_FLASH.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG
    -D OPENKNX_USB_EXCHANGE_IGNORE

; RP2350 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2350_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
board_build.filesystem_size = 892928 ; 0xDA000: FS starts at 0x125000 for all RP2350-TP-2MB targets
build_flags =
    ${BASE.build_flags}
    ${RP2350_TP_2MB_FLASH.build_flags}  ; Use RP2350 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG

; RP2350 TP 4MB Flash Configuration (e.g. REG2-PiPico2 V1 = rpipico2, 4MB)
; Firmware grew past 1 MB (~1054 KB with 2D effects/Effektmanager) → KNX pushed to
; 0x120000, consuming the former 128 KB FREE gap (0x11D000..0x13D000). FS unchanged
; (still starts at 0x13D000). Max firmware now ~1.125 MB (~122 KB headroom).
[RP2350_TP_4MB_FLASH]
build_flags =
    -D KNX_FLASH_SIZE=0x19000       ; 100 KB — enlarged for Effektmanager data
    -D KNX_FLASH_OFFSET=0x120000    ; 1.125 MB — after firmware end (firmware ~1054 KB)
    -D OPENKNX_FLASH_SIZE=0x4000    ; 16 KB
    -D OPENKNX_FLASH_OFFSET=0x139000 ; 0x120000 + 0x19000; ends 0x13D000 = FS start

; RP2350 TP 4MB Releases
[RP2350_TP_4MB_releases]
extends = RP2040_custom, RP2040, RP2040_4MB
board_build.filesystem_size = 2891776 ; 0x2E2000: 0x11D000..0x3FF000 (4MB − KNX − OPENKNX − EEPROM)
build_flags =
    ${BASE.build_flags}
    ${RP2350_TP_4MB_FLASH.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG

; RP2040 TP 2MB Releases - inherits platform settings from RP2040, but overrides flash config
[RP2040_TP_2MB_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
board_build.filesystem_size = 524288 ; 0x80000: central FS size for all RP2040-TP-2MB targets
build_flags =
    ${BASE.build_flags}
    ${RP2040_TP_2MB_FLASH.build_flags}  ; Use RP2040 TP offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG

; RP2040 EXCHANGE Releases (REG2 boards with USB Exchange)
; Uses RP2040_EXCHANGE_FLASH instead of RP2040_FLASH — avoids KNX_FLASH_SIZE redefinition
[RP2040_EXCHANGE_releases]
extends = RP2040_custom, RP2040, RP2040_2MB
build_flags =
    ${BASE.build_flags}
    ${RP2040_EXCHANGE_FLASH.build_flags}  ; Use EXCHANGE offsets instead of RP2040_FLASH
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    -D OPENKNX_WATCHDOG


