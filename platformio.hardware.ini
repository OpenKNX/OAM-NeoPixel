; ============================================================================
; Hardware GPIO Configuration for NeoPixel Module
; ============================================================================
; This file defines hardware-specific GPIO mappings for different boards.
; Each section provides NeoPixel GPIO port definitions that are included
; at compile time via -D flags.
;
; Usage: Add the appropriate section to your environment's 'extends' list
; ============================================================================

; ----------------------------------------------------------------------------
; OpenKNXiao KNeoPix RP2040 V1 (7 GPIO Ports)
; ----------------------------------------------------------------------------
[neopixel_oknxhw_OPENKNXIAO_KNEOPIX_RP2040_V1]
board = rpipico
build_flags =
    -DOKNXHW_OPENKNXIAO_KNEOPIX_RP2040_V1
    -DNEOPIXEL_HW_GPIO_PORTS
    -DNEOPIXEL_HW_PORT_COUNT=7
    -DNEOPIXEL_HW_PORT_1_GPIO=OKNXHW_OPENKNXIAO_NEOPIXEL
    -DNEOPIXEL_HW_PORT_1_LABEL=\"Onboard\"
    -DNEOPIXEL_HW_PORT_2_GPIO=OKNXHW_OPENKNXIAO_D4
    -DNEOPIXEL_HW_PORT_2_LABEL=\"D4\"
    -DNEOPIXEL_HW_PORT_3_GPIO=OKNXHW_OPENKNXIAO_D5
    -DNEOPIXEL_HW_PORT_3_LABEL=\"D5\"
    -DNEOPIXEL_HW_PORT_4_GPIO=OKNXHW_OPENKNXIAO_D8
    -DNEOPIXEL_HW_PORT_4_LABEL=\"D8\"
    -DNEOPIXEL_HW_PORT_5_GPIO=OKNXHW_OPENKNXIAO_D9
    -DNEOPIXEL_HW_PORT_5_LABEL=\"D9\"
    -DNEOPIXEL_HW_PORT_6_GPIO=OKNXHW_OPENKNXIAO_D3
    -DNEOPIXEL_HW_PORT_6_LABEL=\"D3\"
    -DNEOPIXEL_HW_PORT_7_GPIO=OKNXHW_OPENKNXIAO_D10
    -DNEOPIXEL_HW_PORT_7_LABEL=\"SPI-CLK\"

; ----------------------------------------------------------------------------
; OpenKNXiao KNeoPix RP2350 V1 (7 GPIO Ports)
; ----------------------------------------------------------------------------
[neopixel_oknxhw_OPENKNXIAO_KNEOPIX_RP2350_V1]
board = rpipico2
