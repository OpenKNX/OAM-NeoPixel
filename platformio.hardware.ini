; ============================================================================
; Hardware GPIO Configuration for NeoPixel Module
; ============================================================================
; This file defines hardware-specific GPIO mappings for different boards.
; Each section provides NeoPixel GPIO port definitions that are included
; at compile time via -D flags.
;
; Usage: Add the appropriate section to your environment's 'extends' list
; ============================================================================

; ----------------------------------------------------------------------------
; RP2350 WiFi Flash Configuration (replaces RP2040_FLASH for WiFi variants)
; ----------------------------------------------------------------------------
[RP2350_WIFI_FLASH]
build_flags =
  -D KNX_FLASH_SIZE=0x8000
  -D KNX_FLASH_OFFSET=0x120000      ; Moved from 0xF4000 for larger RP2350 WiFi firmware
  -D OPENKNX_FLASH_SIZE=0x4000
  -D OPENKNX_FLASH_OFFSET=0x128000  ; Moved from 0xFC000

; RP2350 WiFi Releases - inherits platform settings from RP2040, but overrides flash config
[RP2350_WIFI_releases]
extends = RP2040_custom, RP2040, RP2040_4MB
board = rpipico2w
board_build.filesystem_size = 2961408
build_flags =
  ${BASE.build_flags}
  ${RP2350_WIFI_FLASH.build_flags}  ; Use WiFi flash offsets instead of RP2040_FLASH
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
  -D OPENKNX_WATCHDOG
  -D OPENKNX_USB_EXCHANGE_IGNORE


; ----------------------------------------------------------------------------
; Misc Variants for NeoPixel Hardware Configurations
; ---------------------------------------------------------------------------
[neopixel_oknxhw_DEVICE_PIPICO_BCU_CONNECTOR]
board = rpipico
build_flags =
    -DDEVICE_PIPICO_BCU_CONNECTOR
    -DOPENKNX_USB_EXCHANGE_IGNORE
    -DNEOPIXEL_HW_GPIO_PORTS
    -DNEOPIXEL_HW_PORT_COUNT=0
    ;-DNEOPIXEL_HW_PORT_1_GPIO=OKNXHW_DEVICE_PIPICO_BCU_CONNECTOR_NEOPIXEL
    ;-DNEOPIXEL_HW_PORT_1_LABEL=\"BCU Connector\"

[neopixel_oknxhw_DEVICE_PIPICO2_BCU_CONNECTOR]
board = rpipico2
board_build.f_cpu = 150000000L
build_flags =
    -DDEVICE_PIPICO2_BCU_CONNECTOR
    -DOPENKNX_USB_EXCHANGE_IGNORE
    -DNEOPIXEL_HW_GPIO_PORTS
    -DNEOPIXEL_HW_PORT_COUNT=0
    ;-DNEOPIXEL_HW_PORT_1_GPIO=OKNXHW_DEVICE_PIPICO2_BCU_CONNECTOR_NEOPIXEL
    ;-DNEOPIXEL_HW_PORT_1_LABEL=\"BCU Connector\"

