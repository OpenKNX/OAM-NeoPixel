[env:debug_OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1]
extends = env:release_OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1
build_type = debug
; debug keeps the legacy 2 MB boundaries - it does not fit the release layout's
; 896 KB firmware region and needs no delta update. See RP2350_TP_2MB_FLASH_DEBUG.
; The release env's own unflags must be repeated here: build_unflags replaces,
; it does not append.
board_build.filesystem_size = 892928
build_unflags =
  -D OPENKNX_USB_MSC
  -D USE_BLOCK_DEVICE_INTERFACE
  ${RP2350_TP_2MB_FLASH_DEBUG.build_unflags}
build_flags =
  ${env:release_OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1.build_flags}
  ${RP2350_TP_2MB_FLASH_DEBUG.build_flags}
  -D OPENKNX_DEBUG

