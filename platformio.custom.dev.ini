;
; platformio.custom.dev.ini — Debug / Development Environments
;
; All [env:debug_*] environments live here.
; Release environments are in platformio.custom.ini.
; Both files are loaded via extra_configs in platformio.ini.
;
; Usage:  pio run -e debug_OKNXHW_OPENKNXIAO_KNEOPIX_RP2350_V1
;

; ============================================================================
; Development Base Sections
; ============================================================================

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG
  ; -D OPENKNX_DEBUGGER
  ; -D OPENKNX_RUNTIME_STAT
  ; -D OPENKNX_RUNTIME_STAT_BUCKETN=7
  ; "-D OPENKNX_RUNTIME_STAT_BUCKETS=100, 200, 500, 1000, 2000, 5000"
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D LOGIC_TRACE
  ; "-D OPENKNX_TRACE1=PIO NeoPixel Spi"
  ; "-D OPENKNX_TRACE1=Meter.*"
  ; "-D OPENKNX_TRACE2=Flash.*"

[custom_develop_ESP32]
extends = ESP32_develop, custom_develop
build_flags =
  ${ESP32_develop.build_flags}
  ${custom_develop.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE

; ============================================================================
; Debug Environments — REG2 Variants
; ============================================================================

; REG2 PiPico2 W V1 — full JLink debug server configuration
[env:debug_OKNXHW_REG2_PIPICO2_W_V1]
extends                      = env:release_OKNXHW_REG2_PIPICO2_W_V1, UPLOAD_JLINK
build_type                   = debug
debug_build_flags            = -Og -g2 -ggdb2
debug_server =
  /usr/local/bin/JLinkGDBServerCL
  -singlerun
  -if
  SWD
  -select
  USB
  -port
  2331
  -device
  RP2350_M33_0

[env:debug_OKNXHW_REG2_PIPICO_V1]
extends = env:release_OKNXHW_REG2_PIPICO_V1
build_type = debug
; debug keeps the legacy 2 MB boundaries - it does not fit the release layout's
; 896 KB firmware region and needs no delta update. See RP2040_TP_2MB_FLASH_DEBUG.
board_build.filesystem_size = 860160
build_unflags = ${RP2040_TP_2MB_FLASH_DEBUG.build_unflags}
build_flags =
  ${env:release_OKNXHW_REG2_PIPICO_V1.build_flags}
  ${RP2040_TP_2MB_FLASH_DEBUG.build_flags}
  -D OPENKNX_DEBUG

[env:debug_OKNXHW_REG2_PIPICO_W_V1]
extends = env:release_OKNXHW_REG2_PIPICO_W_V1
build_type = debug
; debug keeps the legacy 2 MB boundaries - it does not fit the release layout's
; 896 KB firmware region and needs no delta update. See RP2040_TP_2MB_FLASH_DEBUG.
board_build.filesystem_size = 860160
build_unflags = ${RP2040_TP_2MB_FLASH_DEBUG.build_unflags}
build_flags =
  ${env:release_OKNXHW_REG2_PIPICO_W_V1.build_flags}
  ${RP2040_TP_2MB_FLASH_DEBUG.build_flags}
  -D OPENKNX_DEBUG

[env:debug_OKNXHW_REG2_PIPICO2_V1]
extends = env:release_OKNXHW_REG2_PIPICO2_V1
build_type = debug
build_flags =
  ${env:release_OKNXHW_REG2_PIPICO2_V1.build_flags}
